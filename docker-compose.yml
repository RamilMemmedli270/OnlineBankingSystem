services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: onlinebanking-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - onlinebanking-network

  mongodb:
    image: mongo:latest
    container_name: onlinebanking-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - onlinebanking-network

  webapi:
    build:
      context: .
      dockerfile: Presentation/OnlineBankingSystem.WebApi/Dockerfile
    container_name: onlinebanking-webapi
    depends_on:
      sqlserver:
        condition: service_healthy
      mongodb:
        condition: service_started
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=OnlineBankingDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True

      - AdminSeed__Email=admin@onlinebanking.com
      - AdminSeed__Password=Admin123

      - MongoDb__ConnectionString=mongodb://mongodb:27017
      - MongoDb__DatabaseName=OnlineBankingLogs

      - Jwt__Key=SuperSecretKeyForOnlineBankingSystem123456!

    networks:
      - onlinebanking-network

volumes:
  sqlserver_data:
  mongodb_data:

networks:
  onlinebanking-network:
    driver: bridge