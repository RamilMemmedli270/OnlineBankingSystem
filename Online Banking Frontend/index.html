<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş | Online Banking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="auth-wrapper d-flex align-items-center justify-content-center">
        <div class="card auth-card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="auth-brand mb-2">
                        <i class="bi bi-bank"></i> Online Banking
                    </div>
                    <h3 class="fw-bold mb-1" style="color: var(--text-dark);">Xoş gəlmisiniz</h3>
                    <p class="text-muted small">Maliyyənizi asanlıqla idarə edin</p>
                </div>

                <div id="errorBox" class="alert alert-danger d-none" role="alert" style="border-radius: 12px; font-size: 0.9rem;"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">E-poçt ünvanı</label>
                        <input type="email" class="form-control" id="email" placeholder="numune@bank.az" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Şifrə</label>
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label text-muted small" for="rememberMe">Məni xatırla</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2.5">Giriş et</button>
                </form>

                <p class="text-center text-muted mt-4 mb-0 small">
                    Hesabınız yoxdur? <a href="register.html" class="text-primary fw-semibold text-decoration-none">Qeydiyyatdan keçin</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
