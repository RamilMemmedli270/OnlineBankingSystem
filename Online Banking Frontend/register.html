<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qeydiyyat | Online Banking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="auth-wrapper d-flex align-items-center justify-content-center">
        <div class="card auth-card shadow-sm" style="max-width: 520px;">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center fw-bold mb-1">Yeni Hesab</h2>
                <p class="text-center text-muted mb-4">Qeydiyyatdan keçərək hesabınızı yaradın</p>

                <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>

                <form id="registerForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="firstName" class="form-label">Ad</label>
                            <input type="text" class="form-control" id="firstName" placeholder="Adınız" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="lastName" class="form-label">Soyad</label>
                            <input type="text" class="form-control" id="lastName" placeholder="Soyadınız" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="userName" class="form-label">İstifadəçi adı</label>
                            <input type="text" class="form-control" id="userName" placeholder="Məs. anar99" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="phoneNumber" class="form-label">Telefon nömrəsi</label>
                            <input type="text" class="form-control" id="phoneNumber" placeholder="Məs. +99450XXXXXXX" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">E-poçt ünvanı</label>
                        <input type="email" class="form-control" id="email" placeholder="numune@bank.az" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="password" class="form-label">Şifrə</label>
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="confirmPassword" class="form-label">Şifrənin təsdiqi</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Qeydiyyatdan keç</button>
                </form>

                <p class="text-center text-muted mt-4 mb-0">
                    Artıq hesabınız var? <a href="index.html">Giriş edin</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
