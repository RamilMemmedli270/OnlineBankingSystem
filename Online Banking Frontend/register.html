<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qeydiyyat | Online Banking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="auth-wrapper d-flex align-items-center justify-content-center">
        <div class="card auth-card shadow-sm border-0" style="max-width: 520px;">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="auth-brand mb-2">
                        <i class="bi bi-bank"></i> Online Banking
                    </div>
                    <h3 class="fw-bold mb-1" style="color: var(--text-dark);">Yeni Hesab</h3>
                    <p class="text-muted small">Qeydiyyatdan keçərək hesabınızı yaradın</p>
                </div>

                <div id="errorBox" class="alert alert-danger d-none" role="alert" style="border-radius: 12px; font-size: 0.9rem;"></div>

                <form id="registerForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="firstName" class="form-label">Ad</label>
                            <input type="text" class="form-control" id="firstName" placeholder="Adınız" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="lastName" class="form-label">Soyad</label>
                            <input type="text" class="form-control" id="lastName" placeholder="Soyadınız" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="userName" class="form-label">İstifadəçi adı</label>
                            <input type="text" class="form-control" id="userName" placeholder="Məs. anar99" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="phoneNumber" class="form-label">Telefon nömrəsi</label>
                            <input type="text" class="form-control" id="phoneNumber" placeholder="Məs. +99450XXXXXXX" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">E-poçt ünvanı</label>
                        <input type="email" class="form-control" id="email" placeholder="numune@bank.az" required>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="password" class="form-label">Şifrə</label>
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                        </div>
                        <div class="col-md-6">
                            <label for="confirmPassword" class="form-label">Şifrənin təsdiqi</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2.5">Qeydiyyatdan keç</button>
                </form>

                <p class="text-center text-muted mt-4 mb-0 small">
                    Artıq hesabınız var? <a href="index.html" class="text-primary fw-semibold text-decoration-none">Giriş edin</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
