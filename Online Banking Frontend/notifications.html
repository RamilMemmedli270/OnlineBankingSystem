<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bildirişlər | Online Banking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="dashboard-body">

    <nav class="navbar navbar-expand-lg navbar-dark dashboard-header">
        <div class="container-fluid px-4">
            <span class="navbar-brand fw-bold">🏦 Online Banking</span>
            <div class="d-flex align-items-center">
                <span class="text-white me-3" id="userGreeting">Xoş gəldiniz</span>
                <button class="btn btn-outline-light btn-sm" id="logoutBtn">Çıxış</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 dashboard-sidebar p-0">
                <ul class="nav flex-column py-3">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">📊 Dashboard</a>
                    </li>

                    <li class="nav-item" id="navAccounts">
                        <a class="nav-link" href="accounts.html">💳 Hesablarım</a>
                    </li>

                    <li class="nav-item" id="navTransfer">
                        <a class="nav-link" href="transfer.html">🔄 Köçürmə</a>
                    </li>

                    <li class="nav-item" id="navTransactions">
                        <a class="nav-link" href="transactions.html">📜 Əməliyyatlar</a>
                    </li>

                    <li class="nav-item" id="navLoans">
                        <a class="nav-link" href="loans.html">💰 Kreditlər</a>
                    </li>

                    <li class="nav-item" id="navNotifications">
                        <a class="nav-link active" href="notifications.html">🔔 Bildirişlər</a>
                    </li>

                    <li class="nav-item" id="navBalanceAlert">
                        <a class="nav-link" href="balance-alert.html">⚠️ Balans Xəbərdarlığı</a>
                    </li>

                    <li class="nav-item" id="adminLinkWrapper" style="display:none;">
                        <a class="nav-link text-warning" href="admin.html">🛠️ Admin Panel</a>
                    </li>
                </ul>
            </div>

            <div class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1">Bildirişlər</h3>
                        <p class="text-muted mb-0">Bütün bildirişlərinizi buradan izləyin</p>
                    </div>
                </div>

                <ul class="nav nav-tabs mb-4" id="notificationTabs">
                    <li class="nav-item">
                        <button class="nav-link active" id="tabAll" data-filter="all">
                            Bütün Bildirişlər
                        </button>
                    </li>

                    <li class="nav-item">
                        <button class="nav-link" id="tabUnread" data-filter="unread">
                            Oxunmamışlar
                        </button>
                    </li>
                </ul>

                <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

                <div id="loadingState" class="text-center py-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="text-muted mt-2">Bildirişlər yüklənir...</p>
                </div>

                <div id="notificationsContainer" class="d-none">
                    <!-- Bildirişlər bura JS ilə əlavə olunacaq -->
                </div>

                <div id="emptyState" class="text-center text-muted py-5 d-none">
                    <p class="fs-5" id="emptyStateText">
                        Hələ heç bir bildirişiniz yoxdur.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden full name display for dashboard.js compatibility -->
    <span id="fullNameDisplay" style="display: none;"></span>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/notifications.js"></script>
</body>
</html>
