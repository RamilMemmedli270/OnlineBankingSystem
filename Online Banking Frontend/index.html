<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş | Online Banking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="auth-wrapper d-flex align-items-center justify-content-center">
        <div class="card auth-card shadow-sm">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center fw-bold mb-1">Xoş gəlmisiniz</h2>
                <p class="text-center text-muted mb-4">Hesabınıza daxil olun</p>

                <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">E-poçt ünvanı</label>
                        <input type="email" class="form-control" id="email" placeholder="numune@bank.az" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Şifrə</label>
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Məni xatırla</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Giriş et</button>
                </form>

                <p class="text-center text-muted mt-4 mb-0">
                    Hesabınız yoxdur? <a href="register.html">Qeydiyyatdan keçin</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
