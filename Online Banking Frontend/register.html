<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QəpikPay | Qeydiyyat</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #090d16;
            color: #ffffff;
            overflow-x: hidden;
        }

        .auth-container {
            display: flex;
            width: 100vw;
            min-height: 100vh;
        }

        /* --- SOL SÜTUN: LÜKS FINTECH SHOWCASE --- */
        .auth-showcase {
            flex: 1.05;
            background: radial-gradient(circle at 20% 20%, rgba(245, 158, 11, 0.18), transparent 45%),
                        radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.14), transparent 45%),
                        #0b0f19;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            padding: 60px 70px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .glow-orb {
            position: absolute;
            width: 440px;
            height: 440px;
            background: linear-gradient(135deg, #f59e0b, #4f46e5);
            filter: blur(140px);
            opacity: 0.22;
            border-radius: 50%;
            top: 25%;
            left: 15%;
            z-index: 0;
            pointer-events: none;
        }

        .showcase-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            z-index: 1;
        }

        .brand-icon {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.45);
            font-size: 1.4rem;
        }

        .brand-slogan {
            font-size: 0.92rem;
            color: #94a3b8;
            margin-top: 6px;
            font-weight: 500;
        }

        /* 3D Glass Virtual Card */
        .card-showcase-wrapper {
            z-index: 1;
            margin: 30px 0;
            perspective: 1000px;
        }

        .virtual-card {
            width: 390px;
            height: 230px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(24px);
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 32px 64px -12px rgba(0, 0, 0, 0.65), 0 20px 40px -18px rgba(245, 158, 11, 0.25);
            transform: rotateY(-8deg) rotateX(6deg);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
        }

        .virtual-card:hover {
            transform: rotateY(0deg) rotateX(0deg) translateY(-6px);
            box-shadow: 0 40px 80px -12px rgba(0, 0, 0, 0.75), 0 24px 48px -18px rgba(245, 158, 11, 0.35);
        }

        .chip-contactless {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-chip {
            width: 46px;
            height: 34px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #b45309 100%);
            border-radius: 7px;
            position: relative;
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.6);
        }

        .card-balance-preview {
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .showcase-features {
            z-index: 1;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .feature-badge {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 18px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: #cbd5e1;
            backdrop-filter: blur(10px);
        }

        .feature-badge i {
            color: #f59e0b;
            font-size: 1.15rem;
        }

        /* --- SAĞ SÜTUN: FORM BÖLMƏSİ --- */
        .auth-form-wrapper {
            flex: 1.15;
            background-color: #090d16;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            overflow-y: auto;
        }

        .form-card {
            width: 100%;
            max-width: 520px;
        }

        .form-title {
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .form-subtitle {
            font-size: 0.92rem;
            color: #64748b;
            margin-bottom: 24px;
        }

        .input-group-custom {
            margin-bottom: 16px;
        }

        .input-label {
            display: block;
            font-size: 0.76rem;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box i.input-icon {
            position: absolute;
            left: 14px;
            color: #64748b;
            font-size: 1rem;
            pointer-events: none;
            z-index: 2;
        }

        .input-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px 42px 12px 42px;
            color: #ffffff;
            font-size: 0.92rem;
            font-weight: 500;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.05);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15);
        }

        .input-field::placeholder {
            color: #475569;
        }

        .toggle-password-btn {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: color 0.2s;
            z-index: 2;
        }

        .toggle-password-btn:hover {
            color: #cbd5e1;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border: none;
            border-radius: 14px;
            color: #000000;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 24px -4px rgba(245, 158, 11, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px -4px rgba(245, 158, 11, 0.55);
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
        }

        @media (max-width: 992px) {
            .auth-showcase {
                display: none;
            }
            .auth-form-wrapper {
                flex: 1;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        
        <!-- SOL TƏRƏF: VİZUAL FINTECH SHOWCASE -->
        <div class="auth-showcase">
            <div class="glow-orb"></div>

            <div>
                <div class="showcase-brand">
                    <div class="brand-icon">🪙</div>
                    <span>QəpikPay</span>
                </div>
                <div class="brand-slogan">"Son qəpiyinə qədər yanındayıq!" 🪙</div>
            </div>

            <!-- 3D Glass Virtual Card Mockup -->
            <div class="card-showcase-wrapper">
                <div class="virtual-card">
                    <div class="chip-contactless">
                        <div class="card-chip"></div>
                        <i class="bi bi-wifi text-muted fs-4"></i>
                    </div>
                    <div class="card-balance-preview">
                        <span style="font-size: 1.2rem; color: #f59e0b;">₼</span> 0.00
                    </div>
                    <div class="card-bottom">
                        <div>
                            <div style="font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.7;">QəpikPay Qızıl Kart</div>
                            <div style="font-weight: 600; color: #fff; font-size: 0.92rem; letter-spacing: 0.5px;">YENİ MÜŞTƏRİ</div>
                        </div>
                        <div style="font-weight: 800; font-size: 1.2rem; color: #f59e0b; letter-spacing: 1.5px;">QPAY</div>
                    </div>
                </div>
            </div>

            <!-- Feature Badges -->
            <div class="showcase-features">
                <div class="feature-badge">
                    <i class="bi bi-shield-check"></i>
                    <span>Təhlükəsiz Bankçılıq</span>
                </div>
                <div class="feature-badge">
                    <i class="bi bi-coin"></i>
                    <span>Virtual Qutu Yığımı</span>
                </div>
                <div class="feature-badge">
                    <i class="bi bi-lightning-charge"></i>
                    <span>Ani Köçürmələr</span>
                </div>
            </div>
        </div>

        <!-- SAĞ TƏRƏF: REGİSTRASİYA FORMU -->
        <div class="auth-form-wrapper">
            <div class="form-card">
                
                <h2 class="form-title">Yeni Hesab Yaradın 🚀</h2>
                <p class="form-subtitle">QəpikPay ailəsinə qoşulun, maliyyənizi asanlıqla idarə edin.</p>

                <div id="errorBox" class="alert alert-danger d-none" role="alert" style="border-radius: 12px; font-size: 0.9rem; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;"></div>

                <form id="registerForm">
                    <div class="row">
                        <div class="col-sm-6 input-group-custom">
                            <label for="firstName" class="input-label">Ad</label>
                            <div class="input-box">
                                <i class="bi bi-person input-icon"></i>
                                <input type="text" class="input-field" id="firstName" placeholder="Adınız" required>
                            </div>
                        </div>
                        <div class="col-sm-6 input-group-custom">
                            <label for="lastName" class="input-label">Soyad</label>
                            <div class="input-box">
                                <i class="bi bi-person input-icon"></i>
                                <input type="text" class="input-field" id="lastName" placeholder="Soyadınız" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-sm-6 input-group-custom">
                            <label for="userName" class="input-label">İstifadəçi adı</label>
                            <div class="input-box">
                                <i class="bi bi-person-badge input-icon"></i>
                                <input type="text" class="input-field" id="userName" placeholder="Məs. anar99" required>
                            </div>
                        </div>
                        <div class="col-sm-6 input-group-custom">
                            <label for="phoneNumber" class="input-label">Telefon nömrəsi</label>
                            <div class="input-box">
                                <i class="bi bi-telephone input-icon"></i>
                                <input type="tel" class="input-field" id="phoneNumber" placeholder="+99450XXXXXXX" required>
                            </div>
                        </div>
                    </div>

                    <div class="input-group-custom">
                        <label for="email" class="input-label">E-poçt ünvanı</label>
                        <div class="input-box">
                            <i class="bi bi-envelope input-icon"></i>
                            <input type="email" class="input-field" id="email" placeholder="numune@bank.az" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-sm-6 input-group-custom">
                            <label for="password" class="input-label">Şifrə</label>
                            <div class="input-box">
                                <i class="bi bi-lock input-icon"></i>
                                <input type="password" class="input-field" id="password" placeholder="••••••••" required>
                                <button type="button" class="toggle-password-btn" id="togglePasswordBtn1">
                                    <i class="bi bi-eye-slash-fill" id="togglePasswordIcon1"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-sm-6 input-group-custom">
                            <label for="confirmPassword" class="input-label">Şifrənin təsdiqi</label>
                            <div class="input-box">
                                <i class="bi bi-lock-check input-icon"></i>
                                <input type="password" class="input-field" id="confirmPassword" placeholder="••••••••" required>
                                <button type="button" class="toggle-password-btn" id="togglePasswordBtn2">
                                    <i class="bi bi-eye-slash-fill" id="togglePasswordIcon2"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span>Qeydiyyatdan keç</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </form>

                <p class="text-center mt-4 mb-0 small" style="color: #64748b;">
                    Artıq hesabınız var? <a href="index.html" class="fw-semibold text-decoration-none" style="color: #f59e0b;">Daxil olun</a>
                </p>

            </div>
        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
